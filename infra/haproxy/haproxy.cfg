global
  log stdout format raw local0
  maxconn 10000

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 30s

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout retry 1s
  hold valid 5s

frontend public_http
  bind *:8080
  stick-table type ip size 100k expire 10m store conn_cur
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc_conn_cur(0) ge 100 }
  http-request set-header X-Forwarded-For %[src]
  default_backend api_service

backend api_service
  balance leastconn
  option httpchk GET /health/live
  http-check expect status 200
  # Pre-allocate up to 16 backend slots so `pnpm run stack:up -- --replicas N`
  # can scale the api-service service to any value in [1, 16] without
  # editing this config. Active health checks mark unfilled slots DOWN until
  # Docker DNS resolves them, so over-provisioning is safe.
  server-template api 16 api-service:3000 check resolvers docker resolve-prefer ipv4 init-addr none

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 10s
