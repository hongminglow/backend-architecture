global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: api-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-service:3000

  - job_name: outbox-publisher
    metrics_path: /metrics
    static_configs:
      - targets:
          - outbox-publisher:3001

  - job_name: worker-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-service:3002
