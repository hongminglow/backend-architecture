    <circle cx="122" cy="54" r="38" fill="#0f2745"/>
    <use href="#i-db" x="88" y="20" width="68" height="68" class="blue"/>
    <text x="122" y="118" class="badge-title" text-anchor="middle">Postgres</text>
    <text x="122" y="142" class="badge-sub" text-anchor="middle">15432</text>
  </g>

  <g transform="translate(784 808)">
    <rect width="216" height="124" rx="26" fill="#251604" stroke="#f59e0b" stroke-width="1.6" filter="url(#shadow)"/>
    <circle cx="54" cy="46" r="30" fill="#422006"/>
    <use href="#i-queue" x="30" y="22" width="48" height="48" class="amber"/>
    <text x="102" y="48" class="badge-title">RabbitMQ</text>
    <text x="102" y="76" class="badge-sub">15672</text>
  </g>

  <g transform="translate(1138 842)">
