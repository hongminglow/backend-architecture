  <rect x="72" y="930" width="1656" height="58" rx="22" fill="rgba(15,23,42,.82)" stroke="#2a3b54"/>
  <text x="104" y="966" class="legend">Legend: blue sync path | green cache/success | amber durable async | red retry/DLQ | purple observability</text>
  <text x="1218" y="966" class="port">API 8080 | Postgres 15432 | PgBouncer 16432 | RabbitMQ 15672 | Grafana 3001</text>
