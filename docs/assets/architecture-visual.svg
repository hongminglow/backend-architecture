    <text x="90" y="112" class="badge-title" text-anchor="middle">HAProxy</text>
    <text x="90" y="136" class="badge-sub" text-anchor="middle">8080 / 8404</text>
  </g>

  <g transform="translate(440 568)">
    <rect width="180" height="124" rx="26" class="badge"/>
    <circle cx="54" cy="46" r="30" fill="#422006"/>
    <use href="#i-shield" x="30" y="22" width="48" height="48" class="amber"/>
    <text x="102" y="48" class="badge-title">Limits</text>
    <text x="102" y="76" class="badge-sub">cap / IP</text>
  </g>

  <g transform="translate(782 286)">
    <rect width="220" height="174" rx="30" class="badge"/>
    <circle cx="110" cy="58" r="40" fill="#2a1747"/>
    <use href="#i-api" x="74" y="22" width="72" height="72" class="purple"/>
    <text x="110" y="126" class="badge-title" text-anchor="middle">API replicas</text>
    <text x="110" y="151" class="badge-sub" text-anchor="middle">1x / 4x</text>
  </g>

  <g transform="translate(784 594)">
    <rect width="216" height="124" rx="26" class="badge"/>
    <circle cx="54" cy="46" r="30" fill="#422006"/>
    <use href="#i-outbox" x="30" y="22" width="48" height="48" class="amber"/>
    <text x="102" y="48" class="badge-title">Outbox</text>
    <text x="102" y="76" class="badge-sub">commit first</text>
  </g>

  <g transform="translate(1138 244)">
    <rect width="244" height="124" rx="26" fill="#1d120f" stroke="#ef4444" stroke-width="1.6" filter="url(#shadow)"/>
    <circle cx="58" cy="46" r="31" fill="#3f1214"/>
    <use href="#i-cache" x="34" y="22" width="48" height="48" class="red"/>
    <text x="108" y="48" class="badge-title">Redis</text>
    <text x="108" y="76" class="badge-sub">cache / rate</text>
  </g>

  <g transform="translate(1138 444)">
    <rect width="244" height="124" rx="26" fill="#101f36" stroke="#38bdf8" stroke-width="1.6" filter="url(#shadow)"/>
    <circle cx="58" cy="46" r="31" fill="#0f2745"/>
    <use href="#i-pool" x="34" y="22" width="48" height="48" class="blue"/>
    <text x="108" y="48" class="badge-title">PgBouncer</text>
    <text x="108" y="76" class="badge-sub">16432</text>
  </g>

  <g transform="translate(1138 644)">
