    <use href="#i-chart" x="55" y="18" width="48" height="48" class="green"/>
    <text x="79" y="86" class="badge-sub" text-anchor="middle">Prometheus</text>
  </g>

  <g transform="translate(1524 468)">
    <rect width="158" height="110" rx="24" class="badge"/>
    <use href="#i-chart" x="55" y="18" width="48" height="48" class="amber"/>
    <text x="79" y="86" class="badge-sub" text-anchor="middle">Grafana</text>
  </g>

  <path d="M292 344H440" class="line-blue"/>
  <text x="342" y="328" class="flow-label">HTTP</text>
