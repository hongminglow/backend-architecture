    <text x="94" y="38" class="badge-title">Retry</text>
    <text x="94" y="64" class="badge-sub">DLQ</text>
  </g>

  <g transform="translate(1478 724)">
    <rect width="190" height="136" rx="28" fill="#23163f" stroke="#a78bfa" stroke-width="1.6" filter="url(#shadow)"/>
    <circle cx="95" cy="52" r="36" fill="#2a1747"/>
    <use href="#i-worker" x="63" y="20" width="64" height="64" class="purple"/>
