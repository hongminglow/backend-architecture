<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Backend Architecture Playground request flow</title>
  <desc id="desc">Architecture diagram showing client traffic through HAProxy, API replicas, Redis, PgBouncer, Postgres, transactional outbox, RabbitMQ, worker service, observability, retry queue, and dead letter queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 34px; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #475569; }
      .lane { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1.5; rx: 24; filter: url(#shadow); }
      .lane-title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .08em; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; }
      .box-teal { fill: #ecfdf5; stroke: #5eead4; }
      .box-amber { fill: #fffbeb; stroke: #fbbf24; }
      .box-red { fill: #fef2f2; stroke: #fca5a5; }
      .box-violet { fill: #f5f3ff; stroke: #c4b5fd; }
      .box-gray { fill: #f8fafc; stroke: #cbd5e1; }
      .node-title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 19px; fill: #0f172a; }
      .node-text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #475569; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #64748b; }
      .edge { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edge-teal { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#arrow-teal); }
      .edge-dash { stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 12px; fill: #1e293b; }
      .pill { fill: #0f172a; rx: 16; }
      .pill-text { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="64" y="62" class="title">Backend Architecture Playground</text>
  <text x="64" y="94" class="subtitle">Local enterprise-style backend flow: protected entry, horizontal API replicas, pooled DB access, durable events, worker retries, and measurable operations.</text>

  <rect x="54" y="132" width="1492" height="178" class="lane"/>
  <text x="80" y="164" class="lane-title">EDGE AND REQUEST PROTECTION</text>

  <rect x="86" y="192" width="174" height="78" class="box box-blue"/>
  <text x="110" y="223" class="node-title">Client</text>
  <text x="110" y="248" class="node-text">browser, script, k6</text>

  <rect x="338" y="174" width="238" height="114" class="box box-blue"/>
  <text x="366" y="206" class="node-title">HAProxy</text>
  <text x="366" y="231" class="node-text">localhost:8080 API entry</text>
  <text x="366" y="253" class="node-text">least-connections routing</text>
  <text x="366" y="275" class="node-text">active health checks</text>

  <rect x="648" y="174" width="258" height="114" class="box box-amber"/>
  <text x="676" y="206" class="node-title">Request Guardrails</text>
  <text x="676" y="231" class="node-text">connection cap at edge</text>
  <text x="676" y="253" class="node-text">forwarded IP normalization</text>
  <text x="676" y="275" class="node-text">readiness removes bad replicas</text>

  <rect x="1018" y="174" width="244" height="114" class="box box-violet"/>
  <text x="1046" y="206" class="node-title">API Replicas</text>
  <text x="1046" y="231" class="node-text">Fastify + TypeScript</text>
  <text x="1046" y="253" class="node-text">auth, zod validation</text>
  <text x="1046" y="275" class="node-text">graceful HTTP drain</text>

  <rect x="1286" y="178" width="166" height="106" class="box box-violet"/>
  <text x="1312" y="211" class="node-title">Scale Target</text>
  <text x="1312" y="236" class="node-text">1 or 4 replicas</text>
  <text x="1312" y="258" class="node-text">same Docker network</text>

  <path d="M260 231 H338" class="edge"/>
  <path d="M576 231 H648" class="edge"/>
  <path d="M906 231 H1018" class="edge"/>
  <path d="M1262 231 H1286" class="edge"/>
  <text x="282" y="215" class="label">HTTP</text>
  <text x="594" y="215" class="label">protect</text>
  <text x="932" y="215" class="label">route healthy</text>

  <rect x="54" y="348" width="1492" height="252" class="lane"/>
  <text x="80" y="380" class="lane-title">SYNCHRONOUS API PATH</text>

  <rect x="102" y="424" width="226" height="116" class="box box-teal"/>
  <text x="130" y="458" class="node-title">Redis</text>
  <text x="130" y="483" class="node-text">distributed rate limits</text>
  <text x="130" y="505" class="node-text">read-through order cache</text>
  <text x="130" y="527" class="node-text">fail-open behavior</text>

  <rect x="450" y="424" width="230" height="116" class="box box-violet"/>
  <text x="478" y="458" class="node-title">API Logic</text>
  <text x="478" y="483" class="node-text">JWT auth and refresh tokens</text>
  <text x="478" y="505" class="node-text">order CRUD</text>
  <text x="478" y="527" class="node-text">correlation IDs</text>

  <rect x="800" y="424" width="236" height="116" class="box box-blue"/>
  <text x="828" y="458" class="node-title">PgBouncer</text>
  <text x="828" y="483" class="node-text">pgbouncer:6432</text>
  <text x="828" y="505" class="node-text">transaction pooling</text>
  <text x="828" y="527" class="node-text">reduces DB connection pressure</text>

  <rect x="1156" y="424" width="260" height="116" class="box box-blue"/>
  <text x="1184" y="458" class="node-title">Postgres</text>
  <text x="1184" y="483" class="node-text">postgres:5432</text>
  <text x="1184" y="505" class="node-text">users, orders, refresh tokens</text>
  <text x="1184" y="527" class="node-text">outbox and idempotency</text>

  <path d="M565 424 V352 C565 324 1140 324 1140 288" class="edge-dash"/>
  <path d="M450 482 H328" class="edge-teal"/>
  <path d="M680 482 H800" class="edge"/>
  <path d="M1036 482 H1156" class="edge"/>
  <text x="352" y="464" class="label">cache + rate limit</text>
  <text x="704" y="464" class="label">pooled SQL</text>
  <text x="1064" y="464" class="label">backend connections</text>

  <rect x="54" y="638" width="1492" height="236" class="lane"/>
  <text x="80" y="670" class="lane-title">DURABLE ASYNC EVENT PATH</text>

  <rect x="104" y="716" width="232" height="104" class="box box-amber"/>
  <text x="132" y="748" class="node-title">Transactional Outbox</text>
  <text x="132" y="773" class="node-text">order + event in one commit</text>
  <text x="132" y="795" class="node-text">unpublished rows are durable</text>

  <rect x="450" y="716" width="238" height="104" class="box box-amber"/>
  <text x="478" y="748" class="node-title">Outbox Publisher</text>
  <text x="478" y="773" class="node-text">polls with SKIP LOCKED</text>
  <text x="478" y="795" class="node-text">broker confirms then marks sent</text>

  <rect x="804" y="716" width="226" height="104" class="box box-teal"/>
  <text x="832" y="748" class="node-title">RabbitMQ</text>
  <text x="832" y="773" class="node-text">orders exchange</text>
  <text x="832" y="795" class="node-text">durable order.created queue</text>

  <rect x="1146" y="716" width="252" height="104" class="box box-violet"/>
  <text x="1174" y="748" class="node-title">Worker Service</text>
  <text x="1174" y="773" class="node-text">prefetch backpressure</text>
  <text x="1174" y="795" class="node-text">idempotent event processing</text>

  <rect x="804" y="842" width="226" height="62" class="box box-red"/>
  <text x="832" y="869" class="node-title">Retry + DLQ</text>
  <text x="832" y="891" class="node-text">bounded poison-message handling</text>

  <path d="M220 716 V540" class="edge-teal"/>
  <path d="M336 768 H450" class="edge"/>
  <path d="M688 768 H804" class="edge"/>
  <path d="M1030 768 H1146" class="edge"/>
  <path d="M1272 716 V540" class="edge-teal"/>
  <path d="M917 820 V842" class="edge-dash"/>
  <text x="238" y="626" class="label">same DB transaction</text>
  <text x="368" y="750" class="label">poll</text>
  <text x="720" y="750" class="label">publish</text>
  <text x="1060" y="750" class="label">consume</text>
  <text x="1292" y="626" class="label">processed_events</text>

  <rect x="54" y="904" width="1492" height="44" fill="#0f172a" rx="18"/>
  <text x="84" y="932" class="pill-text">Observability:</text>
  <text x="186" y="932" class="pill-text">Prometheus scrapes API, outbox, and worker metrics. Grafana visualizes latency, request rate, outbox backlog, worker throughput, in-flight messages, and DLQ volume.</text>

  <rect x="1192" y="54" width="306" height="58" class="box box-gray"/>
  <text x="1216" y="79" class="small">Default local host ports</text>
  <text x="1216" y="100" class="small">API 8080 / Postgres 15432 / PgBouncer 16432</text>
</svg>
